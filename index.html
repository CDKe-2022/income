<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- user-scalable=no + maximum-scale=1 挡住双指缩放；iOS Safari 从 10 版起
     会忽略这两个值，所以还要靠 JS 拦 gesturestart，以及下面的 touch-action -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="账本">
<title>账本</title>
<style>
  /* ============ 基础 ============ */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    color-scheme: light dark;
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --label: #1C1C1E;
    --label-2: rgba(60, 60, 67, .60);
    --label-3: rgba(60, 60, 67, .30);
    --sep: rgba(60, 60, 67, .12);
    --fill: rgba(120, 120, 128, .10);
    --press: rgba(120, 120, 128, .14);
    --nav-bg: rgba(242, 242, 247, .82);
    --blue: #007AFF;
    --green: #34C759;
    --red: #FF3B30;
    --card-edge: 0 .5px 0 rgba(0, 0, 0, .02), 0 1px 2px rgba(0, 0, 0, .03);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1C1C1E;
      --label: #FFFFFF;
      --label-2: rgba(235, 235, 245, .60);
      --label-3: rgba(235, 235, 245, .30);
      --sep: rgba(84, 84, 88, .60);
      --fill: rgba(120, 120, 128, .22);
      --press: rgba(120, 120, 128, .28);
      --nav-bg: rgba(22, 22, 24, .82);
      --blue: #0A84FF;
      --green: #30D158;
      --red: #FF453A;
      --card-edge: 0 0 0 .5px rgba(255, 255, 255, .08);
    }
  }
  html, body { margin: 0; padding: 0; }
  /* 双指缩放与双击缩放都挡掉，让它更接近原生 App。
     pan-x pan-y 保留单指滚动，pinch-zoom 不给 —— 这是禁双指缩放的
     标准做法，配合上面的 viewport 一起生效。 */
  html { touch-action: pan-x pan-y; }
  body {
    background: var(--bg);
    color: var(--label);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.45;
    padding-bottom: calc(110px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  /* 图表、芯片这类不该被手势干扰的区域，单独锁死 touch-action */
  .chart-svg, .donut-box, .chips, .seg, .type-seg { touch-action: pan-x pan-y; }
  [hidden] { display: none !important; }
  button { font: inherit; cursor: pointer; }
  input {
    font: inherit; color: var(--label);
    background: transparent; border: none; outline: none; padding: 0;
  }
  input::placeholder { color: var(--label-3); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  /* ============ 顶部导航 ============ */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    height: calc(44px + env(safe-area-inset-top));
    padding-top: env(safe-area-inset-top);
    display: flex; align-items: center; justify-content: center;
    background: transparent;
    transition: background .2s;
  }
  .nav.scrolled {
    background: var(--nav-bg);
    box-shadow: 0 .5px 0 var(--sep);
    -webkit-backdrop-filter: saturate(180%) blur(18px);
    backdrop-filter: saturate(180%) blur(18px);
  }
  .nav-title {
    font-size: 17px; font-weight: 600;
    opacity: 0; transform: translateY(5px);
    transition: opacity .2s, transform .2s;
  }
  .nav.scrolled .nav-title { opacity: 1; transform: none; }
  .nav-actions {
    position: absolute;
    right: max(8px, calc(50% - 268px));
    top: env(safe-area-inset-top);
    height: 44px;
    display: flex; align-items: center;
  }
  .icon-btn {
    width: 40px; height: 40px; border: none; border-radius: 50%;
    background: transparent; color: var(--blue);
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:active { background: var(--press); }
  .icon-btn svg { width: 21px; height: 21px; }
  .icon-btn.spin svg { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============ 主页 ============ */
  .page { padding-top: calc(env(safe-area-inset-top) + 8px); }
  .large-title {
    font-size: 32px; font-weight: 700; letter-spacing: -.5px;
    margin: 0; padding: 8px 4px 0;
  }
  .hero { padding: 20px 4px 4px; }
  .hero-label { font-size: 15px; color: var(--label-2); }
  .hero-amount {
    font-size: clamp(38px, 11vw, 46px);
    font-weight: 700; letter-spacing: -1px; line-height: 1.15;
    margin: 2px 0 6px;
    font-variant-numeric: tabular-nums;
  }
  .hero-sub { font-size: 14px; color: var(--label-2); }
  .hero-sub b {
    font-weight: 600; color: var(--label);
    font-variant-numeric: tabular-nums;
  }
  #statIncome { color: var(--green); }

  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 24px 4px 9px;
    font-size: 13px; color: var(--label-2);
  }
  .group-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 16px 4px 7px;
    font-size: 13px; color: var(--label-2);
  }
  .group-head .sum { font-variant-numeric: tabular-nums; }
  .group-head .d { color: var(--label); font-weight: 600; }

  /* ============ 记录列表 ============ */
  .card {
    background: var(--card);
    border-radius: 24px;
    box-shadow: var(--card-edge);
    overflow: hidden;
  }
  .item {
    position: relative;
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px; min-height: 58px;
    cursor: pointer;
  }
  .item + .item::before {
    content: ''; position: absolute; left: 64px; right: 0; top: 0;
    height: .5px; background: var(--sep);
  }
  .item:active { background: var(--fill); }
  .bubble {
    width: 38px; height: 38px; border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .bubble svg { width: 19px; height: 19px; }
  .item .body { flex: 1; min-width: 0; }
  .item .t {
    font-size: 15.5px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .item .n {
    font-size: 13px; color: var(--label-2); margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .item .right { text-align: right; flex-shrink: 0; }
  .item .amt { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .item .amt.in { color: var(--green); }
  .item .time { font-size: 12px; color: var(--label-3); margin-top: 2px; }

  /* ============ 页面分段（明细 / 统计） ============ */
  .page-seg {
    display: flex;
    background: var(--fill);
    border-radius: 999px; padding: 3px;
    margin: 12px 0 8px;
  }
  .page-seg button {
    flex: 1; height: 32px; border: none; background: transparent;
    border-radius: 999px; font-size: 14px; color: var(--label-2);
  }
  .page-seg button.on {
    background: var(--card); color: var(--label); font-weight: 600;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 0, 0, .04);
  }

  /* ============ 统计视图 ============ */
  .month-nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 0 6px;
  }
  .m-btn {
    width: 38px; height: 38px; border: none; border-radius: 50%;
    background: transparent; color: var(--blue);
    display: flex; align-items: center; justify-content: center;
  }
  .m-btn:active:not(:disabled) { background: var(--press); }
  .m-btn:disabled { color: var(--label-3); }
  .m-btn svg { width: 20px; height: 20px; }
  .m-label { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  /* 翻离本月后出现的小胶囊，点了回本月 */
  .m-back {
    display: block; margin: 0 auto 12px;
    height: 28px; padding: 0 14px;
    border: none; border-radius: 999px;
    background: var(--fill); color: var(--blue);
    font-size: 13px; font-weight: 500;
  }
  .m-back:active { opacity: .6; }

  /* 某月没有任何记录时，图表区统一用它占位 */
  .month-empty {
    background: var(--card);
    border-radius: 18px;
    padding: 28px 16px;
    text-align: center;
    color: var(--label-2); font-size: 14px;
    box-shadow: var(--card-edge);
    margin-bottom: 12px;
  }
  .month-empty svg { width: 34px; height: 34px; color: var(--label-3); display: block; margin: 0 auto 10px; }

  .stat-cards {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; margin-bottom: 14px;
  }
  .stat-chip {
    background: var(--card); border-radius: 20px;
    box-shadow: var(--card-edge);
    padding: 12px 6px 10px; text-align: center; min-width: 0;
  }
  .sc-label { font-size: 12px; color: var(--label-2); }
  .sc-val {
    font-size: 15px; font-weight: 600; margin-top: 3px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .sc-val.pos { color: var(--green); }
  .sc-val.neg { color: var(--red); }

  .chart-card {
    background: var(--card); border-radius: 24px;
    box-shadow: var(--card-edge);
    padding: 16px 16px 14px; margin-bottom: 14px;
    overflow: hidden;
  }
  .cc-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 15px; font-weight: 600; margin-bottom: 10px;
  }
  .cc-sub { font-size: 12px; font-weight: 400; color: var(--label-2); }
  .cc-sub .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    margin: 0 4px 0 10px; vertical-align: 1px;
  }
  .cc-sub .dot.e { background: var(--blue); margin-left: 0; }
  .cc-sub .dot.i { background: var(--green); }

  .donut-box { position: relative; width: 208px; margin: 2px auto 12px; }
  .donut-box svg { display: block; width: 100%; height: auto; }
  .donut-box g { cursor: pointer; }
  .donut-box circle { transition: opacity .15s, stroke-width .15s; }
  .donut-box.dim circle:not(.sel) { opacity: .28; }
  .donut-box circle.sel { stroke-width: 29; }
  .donut-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; pointer-events: none; padding: 0 44px;
  }
  .dc-val { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
  .dc-lab { font-size: 11.5px; color: var(--label-2); margin-top: 2px; line-height: 1.35; }

  .dl-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; margin: 0 -10px;
    border-radius: 14px; cursor: pointer;
    -webkit-user-select: none; user-select: none;
  }
  .dl-row:active, .dl-row.sel { background: var(--fill); }
  .dl-ic {
    width: 26px; height: 26px; border-radius: 9px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .dl-ic svg { width: 14px; height: 14px; }
  .dl-name {
    flex: 1; min-width: 0; font-size: 14.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dl-amt { text-align: right; flex-shrink: 0; }
  .dl-amt .a { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .dl-amt .p { font-size: 11.5px; color: var(--label-2); font-variant-numeric: tabular-nums; }

  .chart-svg { display: block; width: 100%; height: auto; }
  .chart-svg .ax { fill: var(--label-3); font-size: 9.5px; font-variant-numeric: tabular-nums; }
  .chart-svg .gl { stroke: var(--sep); stroke-width: 1; }
  .chart-svg .hit { cursor: pointer; }
  .chart-svg .bar { fill: var(--blue); opacity: .3; transition: opacity .15s; }
  .chart-svg .bar.today { opacity: .55; }
  .chart-svg .bar.on { opacity: 1; }
  .chart-svg .bar.in { fill: var(--green); }
  .chart-svg .avg { stroke: var(--blue); opacity: .5; stroke-width: 1; stroke-dasharray: 3 3; }
  .chart-cap {
    text-align: center; font-size: 12.5px; color: var(--label-2);
    padding-top: 10px; font-variant-numeric: tabular-nums;
  }
  .chart-empty {
    padding: 34px 12px; text-align: center;
    color: var(--label-3); font-size: 13px;
  }

  .more-note {
    text-align: center; color: var(--label-3);
    font-size: 12.5px; padding: 14px 0 4px;
  }

  /* ============ 状态（加载 / 空 / 错误） ============ */
  .state {
    padding: 52px 20px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    color: var(--label-2); font-size: 14px; text-align: center;
  }
  .state-sub { font-size: 13px; color: var(--label-3); }
  .spinner {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2.5px solid var(--sep); border-top-color: var(--label-3);
    animation: spin .8s linear infinite;
  }
  .bubble-big {
    width: 60px; height: 60px; border-radius: 50%;
    background: var(--fill); color: var(--label-3);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 2px;
  }
  .bubble-big svg { width: 28px; height: 28px; }
  .retry {
    background: none; border: none; color: var(--blue);
    font-size: 15px; padding: 8px 18px;
  }
  .error-text { color: var(--red); font-size: 14px; word-break: break-all; }

  /* ============ 记一笔按钮 ============ */
  .fab {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(18px + env(safe-area-inset-bottom));
    z-index: 15;
    height: 50px; padding: 0 26px; border: none; border-radius: 25px;
    background: var(--blue); color: #fff;
    font-size: 16px; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
    box-shadow: 0 8px 22px rgba(0, 122, 255, .35), 0 2px 6px rgba(0, 122, 255, .22);
    transition: transform .15s ease;
  }
  .fab:active { transform: translateX(-50%) scale(.96); }
  .fab svg { width: 17px; height: 17px; }

  /* ============ 弹层通用 ============ */
  .mask {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(0, 0, 0, .35);
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .mask.on { opacity: 1; pointer-events: auto; }

  /* ============ 记一笔（底部抽屉） ============ */
  .sheet {
    --accent: var(--blue);
    width: 100%; max-width: 560px;
    background: var(--card);
    border-radius: 28px 28px 0 0;
    padding: 6px 18px calc(16px + env(safe-area-inset-bottom));
    max-height: calc(100% - 44px);
    overflow-y: auto;
    overscroll-behavior: contain;
    transform: translateY(100%);
    transition: transform .35s cubic-bezier(.32, .72, .35, 1);
    box-shadow: 0 -6px 32px rgba(0, 0, 0, .12);
  }
  .mask.on .sheet { transform: translateY(0); }
  .sheet.income { --accent: var(--green); }
  .grabber {
    width: 36px; height: 5px; border-radius: 3px;
    background: var(--label-3); margin: 4px auto 2px;
  }
  .sheet-head {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    height: 42px;
  }
  .sheet-cancel {
    position: absolute; left: -8px; top: 0;
    background: none; border: none; color: var(--blue);
    font-size: 16px; padding: 10px 8px;
  }
  .sheet-title { font-size: 17px; font-weight: 600; }

  .seg {
    display: flex;
    background: var(--fill);
    border-radius: 999px; padding: 3px;
    margin-bottom: 12px;
  }
  .seg button {
    flex: 1; border: none; background: transparent;
    height: 30px; border-radius: 999px;
    font-size: 14px; color: var(--label-2);
  }
  .seg button.on {
    background: var(--card); color: var(--accent); font-weight: 600;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 0, 0, .04);
  }

  .amount-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--fill);
    border-radius: 24px;
    height: 62px; padding: 0 18px;
    margin-bottom: 10px;
    transition: box-shadow .15s;
  }
  .amount-box:focus-within { box-shadow: 0 0 0 1.5px var(--accent); }
  .amount-box .cur { font-size: 22px; font-weight: 600; color: var(--label-2); }
  #fAmount {
    flex: 1; min-width: 0;
    font-size: 32px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  #fAmount::-webkit-outer-spin-button,
  #fAmount::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .fields {
    background: var(--fill);
    border-radius: 24px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .field {
    position: relative;
    display: flex; align-items: center; gap: 12px;
    height: 48px; padding: 0 16px;
  }
  .field + .field::before {
    content: ''; position: absolute; left: 16px; right: 0; top: 0;
    height: .5px; background: var(--sep);
  }
  .field label {
    width: 74px; flex-shrink: 0;
    font-size: 15px; color: var(--label-2);
  }
  .field:focus-within label { color: var(--label); }
  .field input { flex: 1; min-width: 0; font-size: 15px; }

  /* ============ 芯片式选择（分类 / 支付方式） ============ */
  /* 芯片块：标题 + 可横向滚动的选项行，替代原来的自由输入框。
     常用项一下点中，冷门项走行尾的「自定义」入口，两边都不耽误。 */
  .chip-block { padding: 10px 0 2px; }
  .chip-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; margin-bottom: 8px;
  }
  .chip-head > span { font-size: 13px; color: var(--label-2); }
  /* 行尾的「自定义」文字按钮，选中的值不在预设里时会自动亮起 */
  .chip-custom-btn {
    background: none; border: none; padding: 2px 0;
    font-size: 13px; color: var(--accent);
  }
  .chip-custom-btn:active { opacity: .55; }

  /* 滚动的芯片行。负 margin 让芯片能贴到抽屉边缘，滚动时不显得被裁 */
  .chips {
    display: flex; gap: 8px;
    overflow-x: auto; overflow-y: hidden;
    padding: 2px 16px 8px;
    margin: 0 -18px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .chips::-webkit-scrollbar { display: none; }

  .chip {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; gap: 5px;
    height: 34px; padding: 0 14px;
    border: none; border-radius: 999px;
    background: var(--card);
    color: var(--label);
    font-size: 14px; font-weight: 500;
    white-space: nowrap;
    box-shadow: 0 0 0 .5px var(--sep);
    transition: transform .12s ease, background .15s, color .15s;
  }
  .chip:active { transform: scale(.95); }
  /* 选中态：用当前模式的强调色（支出蓝 / 收入绿）填充 */
  .chip.on {
    background: var(--accent); color: #fff;
    box-shadow: none; font-weight: 600;
  }
  /* 芯片里的小圆点：沿用分类图标的颜色，未选中时提示分类归属 */
  .chip .dot-c {
    width: 7px; height: 7px; border-radius: 50%;
    background: currentColor; opacity: .85; flex-shrink: 0;
  }
  .chip.on .dot-c { background: #fff; opacity: 1; }

  /* 自定义输入行：默认不出现在布局里，点「自定义」才展开 */
  .chip-custom {
    display: flex; align-items: center; gap: 8px;
    margin: 0 16px 8px;
    background: var(--card);
    border-radius: 999px;
    padding: 0 14px; height: 36px;
    box-shadow: 0 0 0 1px var(--accent);
  }
  .chip-custom input { flex: 1; min-width: 0; font-size: 14px; }
  .chip-custom button {
    background: none; border: none; color: var(--accent);
    font-size: 14px; font-weight: 600; padding: 4px 0;
  }

  /* ============ 数据不完整警示条 ============ */
  .warn-bar {
    display: flex; align-items: flex-start; gap: 8px;
    background: rgba(255, 149, 0, .12);
    color: #B25E00;
    border-radius: 14px;
    padding: 10px 14px;
    font-size: 13px; line-height: 1.45;
    margin-bottom: 12px;
  }
  @media (prefers-color-scheme: dark) { .warn-bar { color: #FFB340; } }
  .warn-bar svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1.5px; }

  /* ============ 日期快捷按钮 ============ */
  .date-quick { display: flex; gap: 6px; flex-shrink: 0; }
  .date-quick button {
    height: 28px; padding: 0 10px;

<script>
/* ================= 禁用手势缩放 =================
   viewport 的 user-scalable=no 在新版 iOS Safari 上会被忽略，得从事件层兜。
   三条路都要堵：双指捏合(gesturestart/change/end)、双击放大、以及
   Safari 的双指缩放(gesture*)。全部 preventDefault。 */
['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
  document.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
});

/* 双击缩放：iOS 上双击会触发缩放。用一个 300ms 内的连续两次 touchend 判定，
   真命中就 preventDefault。注意别把正常的单击/双击交互误伤 ——
   只在两次点击间隔极短且位置几乎相同时才拦。 */
let lastTap = 0;
let lastTapX = 0, lastTapY = 0;
document.addEventListener('touchend', function (e) {
  /* 落在输入框上的点击不管，免得影响选词/光标 */
  if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const now = Date.now();
  const t = e.changedTouches && e.changedTouches[0];
  if (!t) return;
  const dx = Math.abs(t.clientX - lastTapX);
  const dy = Math.abs(t.clientY - lastTapY);
  /* 300ms 内、位移小于 30px，判为双击 → 拦掉 */
  if (now - lastTap < 300 && dx < 30 && dy < 30) {
    e.preventDefault();
    lastTap = 0;
  } else {
    lastTap = now;
    lastTapX = t.clientX;
    lastTapY = t.clientY;
  }
}, { passive: false });

/* 双指触摸直接拦 —— 有些安卓浏览器不走 gesture* 事件 */
document.addEventListener('touchmove', function (e) {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

/* 双指按下也拦：避免 iOS 从"双指"进入缩放态 */
document.addEventListener('touchstart', function (e) {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

/* 桌面浏览器 Ctrl+滚轮缩放也顺手挡掉，保持体验一致 */
document.addEventListener('wheel', function (e) {
  if (e.ctrlKey) e.preventDefault();
}, { passive: false });

/* ================= 配置与状态 ================= */
const LS_KEY = 'ledger_cfg_v1';
let cfg = null;
let records = [];
let formType = 'expense';
let pendingDeleteId = null;
let toastTimer = null;
let view = 'list';        // 明细 / 统计
let statYm = null;        // 统计视图正在查看的月份 {y, m}
let selCat = null;        // 占比图选中的分类
let selDay = null;        // 每日图选中的日期
let selMon = null;        // 月度图选中的月份
let editingId = null;     // 正在编辑的记录 id（null = 新增）
let dataTruncated = false; // 列表是否被服务端截断（统计可能不完整）

/* ================= 预设选项 =================
   分类严格对齐后端 AI 的 10 个取值（见 Worker 里的 SYSTEM_PROMPT），
   否则 AI 记的账和手动记的账会分到不同桶里，统计对不上。
   label 后面可选带 dot：芯片上的小圆点颜色，沿用图标色。 */
const CAT_EXPENSE = [
  { v: '餐饮', dot: '#FF9500' },
  { v: '交通', dot: '#007AFF' },
  { v: '购物', dot: '#FF2D55' },
  { v: '娱乐', dot: '#AF52DE' },
  { v: '居住', dot: '#30B0C7' },
  { v: '医疗', dot: '#FF3B30' },
  { v: '通讯', dot: '#5856D6' },
  { v: '教育', dot: '#A2845E' },
  { v: '人情', dot: '#FFCC00' },
  { v: '其他', dot: '#8E8E93' },
];

/* 收入侧的分类后端统一归「其他」，但手动记账时列几个常用的更顺手。
   它们最终仍以文本存库，统计时按「其他」口径看即可。 */
const CAT_INCOME = [
  { v: '工资' }, { v: '奖金' }, { v: '红包' }, { v: '理财' }, { v: '报销' }, { v: '退款' }, { v: '其他' },
];

/* 支付方式。按使用频率排序，前几个一眼就能点中 */
const ACCOUNTS_EXPENSE = [
  { v: '微信' }, { v: '支付宝' }, { v: '银行卡' }, { v: '现金' }, { v: '信用卡' }, { v: '云闪付' },
];
const ACCOUNTS_INCOME = [
  { v: '微信' }, { v: '支付宝' }, { v: '银行卡' }, { v: '现金' },
];

const $ = (id) => document.getElementById(id);

function loadCfg() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch { return null; }
}
function saveCfg(c) { localStorage.setItem(LS_KEY, JSON.stringify(c)); }

/* 支持用带参数的链接一次配好，例如：
   https://xxx.pages.dev/#api=https://yyy.workers.dev&token=abcdef
   参数写进本地存储后立刻从地址栏抹掉。 */
(function autoConfigFromUrl() {
  const fromHash = new URLSearchParams(location.hash.replace(/^#/, ''));
  const fromQuery = new URLSearchParams(location.search);
  const api = fromHash.get('api') || fromQuery.get('api');
  const token = fromHash.get('token') || fromQuery.get('token');
  if (!api && !token) return;
  const cur = loadCfg() || {};
  const next = { api: api || cur.api || '', token: token || cur.token || '' };
  if (next.api && next.token) {
    saveCfg(next);
    history.replaceState(null, '', location.pathname);
  }
})();

function setupLink(c) {
  return location.origin + location.pathname +
    '#api=' + encodeURIComponent(c.api) + '&token=' + encodeURIComponent(c.token);
}

/* ================= 格式化 ================= */
function fmtMoney(n) {
  return Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function money(n) { return '¥' + fmtMoney(n); }
function pad(x) { return String(x).padStart(2, '0'); }
const WD = ['日', '一', '二', '三', '四', '五', '六'];
const MN = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二'];

function fx(n) { return Math.round(n * 10) / 10; }
function fmtShort(n) {
  n = Number(n) || 0;
  if (n >= 100000) return Math.round(n / 10000) + '万';
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
  return String(Math.round(n));
}
function fmtPct(p) { return (p >= 99.95 ? 100 : p >= 10 ? p.toFixed(0) : p.toFixed(1)) + '%'; }
function niceStep(maxV) {
  const steps = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000, 200000, 500000];
  for (const st of steps) if (maxV / st <= 3) return st;
  /* 兜底按数量级递推，而不是写死 —— 巨额数据下刻度也不会只剩一两根 */
  let st = 1000000;
  while (maxV / st > 3) st *= 2;
  return st;
}
function recDate(r) { return new Date(r.occurred_at); }
function inMonth(d, y, m) { return d.getFullYear() === y && d.getMonth() === m; }
function monthRecords(y, m) {
  return records.filter(r => { const d = recDate(r); return !isNaN(d.getTime()) && inMonth(d, y, m); });
}
function monthKeyOf(y, m) { return y + '-' + pad(m + 1); }
function hm(v) {
  const d = new Date(v);
  if (isNaN(d.getTime())) return '';
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function dayLabel(d) {
  const now = new Date();
  const md = (d.getMonth() + 1) + '月' + d.getDate() + '日';
  const wd = '周' + WD[d.getDay()];
  const base = (d.getFullYear() === now.getFullYear()) ? md : d.getFullYear() + '年' + md;
  if (d.toDateString() === now.toDateString()) return '<span class="d">今天</span> · ' + base + ' ' + wd;
  const y = new Date(now); y.setDate(y.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return '<span class="d">昨天</span> · ' + base + ' ' + wd;
  return base + ' ' + wd;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

/* ================= 分类图标 =================
   图标表比分类表「宽」：travel / wear 没有独立分类，但记账时
   「衣服」「回家机票」这类备注仍该显示对应图案，靠 note 二次匹配兜。
   这样统计口径（10 类）和视觉辨识度两不误。 */

const RULES = [
  /* 顺序即优先级：先匹配到的赢。旅行排在娱乐/购物前，
     免得「酒店」被更靠后的规则抢走图标。 */
  { i: 'travel',  k: ['旅行', '旅游', '酒店', '民宿', '度假', '景区', '机票', '航班', '高铁', '风景'] },
  { i: 'transit', k: ['交通', '打车', '地铁', '公交', '加油', '停车', '出行', '骑行', '单车', '滴滴', '高铁', '火车', '出租', '车费', '高速'] },
  { i: 'food',    k: ['餐', '饭', '吃', '食', '外卖', '宵夜', '夜宵', '奶茶', '咖啡', '饮料', '茶', '水果', '零食', '菜', '食堂', '烧烤', '火锅', '小吃', '酒'] },
  { i: 'shop',    k: ['购物', '超市', '便利', '电商', '淘宝', '京东', '拼多多', '百货', '日用', '商场', '快递', '下单'] },
  { i: 'home',    k: ['居住', '住', '房租', '水电', '物业', '家用', '家居', '燃气', '房贷', '租房', '电费', '水费', '煤气'] },
  { i: 'comm',    k: ['通讯', '话费', '流量', '月租', '宽带', '订阅', '云服务', '服务器', '网费'] },
  { i: 'fun',     k: ['娱乐', '游戏', '电影', '视频', '演出', '会员', '音乐', '追剧', 'KTV', '酒吧', '剧本杀', '健身'] },
  { i: 'health',  k: ['医疗', '药', '医院', '看病', '健康', '体检', '挂号', '诊所', '牙'] },
  { i: 'edu',     k: ['教育', '学习', '书', '课', '培训', '学费', '文具', '考试', '网课'] },
  { i: 'gift',    k: ['人情', '礼物', '红包', '份子', '孝敬', '礼金', '请客'] },
  /* 服饰没有独立分类（后端只出 10 类），但图标保留，靠备注/分类文本命中 */
  { i: 'wear',    k: ['服饰', '衣', '鞋', '美妆', '护肤', '化妆', '裤', '帽', '饰', '包'] },
];

/* 命中规则：分类文本优先，没中再用备注兜一次。
   这样 AI 归到「购物」、备注写「优衣库T恤」的记录，也能显示服饰图标。 */
function iconFor(r) {
  if (r.type === 'income') return ICONS.income;
  const cat = String(r.category || '').toLowerCase();
  for (const rule of RULES) {
    if (rule.k.some(k => cat.includes(k))) return ICONS[rule.i];
  }
  const note = String(r.note || '').toLowerCase();
  if (note) {
    for (const rule of RULES) {
      if (rule.k.some(k => note.includes(k))) return ICONS[rule.i];
    }
  }
  return ICONS.other;
}

/* ================= 接口 ================= */
async function api(path, options = {}) {
  const url = cfg.api.replace(/\/+$/, '') + path;
  const headers = Object.assign({ 'x-token': cfg.token }, options.headers || {});
  const res = await fetch(url, Object.assign({}, options, { headers }));
  const data = await res.json().catch(() => ({ ok: false, error: '返回内容不是 JSON' }));
  if (!res.ok || data.ok === false) {
    const err = new Error(data.error || ('HTTP ' + res.status));
    err.status = res.status;
    throw err;
  }
  return data;
}

/* ================= 渲染 ================= */
function setLoading() {
  $('total').textContent = '¥ --';
  $('statIncome').textContent = '--';
  $('statCount').textContent = '--';
  $('recordCount').textContent = '';
  $('list').innerHTML = '<div class="state"><div class="spinner"></div><div>正在加载…</div></div>';

function renderError(e) {
  $('list').innerHTML =
    '<div class="state">' +
      '<div class="error-text">读取失败：' + esc(e.message) + '</div>' +
      '<button class="retry" id="retryBtn">重试</button>' +
    '</div>';
  const rb = $('retryBtn');
  if (rb) rb.onclick = () => load().catch(() => {});
}

function itemHtml(r) {
  const isExp = r.type !== 'income';
  const ic = iconFor(r);
  const bits = [];
  if (r.note) bits.push(esc(r.note));
  if (r.account) bits.push(esc(r.account));
  const title = esc(r.category || (isExp ? '支出' : '收入'));
  return '<div class="item" data-id="' + esc(r.id) + '" role="button" tabindex="0">' +
    '<div class="bubble" style="color:' + ic.c + ';background:' + ic.c + '1E">' + ic.s + '</div>' +
    '<div class="body">' +
      '<div class="t">' + title + '</div>' +
      (bits.length ? '<div class="n">' + bits.join(' · ') + '</div>' : '') +
    '</div>' +
    '<div class="right">' +
      '<div class="amt' + (isExp ? '' : ' in') + '">' + (isExp ? '−' : '+') + money(r.amount) + '</div>' +
      '<div class="time">' + esc(hm(r.occurred_at)) + '</div>' +
    '</div>' +
  '</div>';
}

function render() {
  const now = new Date();

  const mTitle = MN[now.getMonth()] + '月';
  $('largeTitle').textContent = mTitle;
  $('navTitle').textContent = mTitle + '账本';
  document.title = mTitle + '账本';

  /* 本月汇总（按本地时区归属月份） */
  let expense = 0, income = 0, monthCount = 0;
  records.forEach(r => {
    const d = recDate(r);
    if (isNaN(d.getTime()) || !inMonth(d, now.getFullYear(), now.getMonth())) return;
    if (r.type === 'expense') expense += Number(r.amount);
    else income += Number(r.amount);
    monthCount++;
  });

  $('total').textContent = money(expense);
  $('statIncome').textContent = money(income);
  $('statCount').textContent = monthCount + ' 笔';
  $('recordCount').textContent = '共 ' + records.length + ' 条';

  if (!records.length) {
    $('list').innerHTML =
      '<div class="state">' +
        '<div class="bubble-big">' + ICONS.empty.s + '</div>' +
        '<div>还没有记录</div>' +
        '<div class="state-sub">点下方「记一笔」，或用快捷指令记第一笔</div>' +
      '</div>';
    return;
  }

  /* 按天分组（列表只展示最近 60 条，更早的看统计） */
  const MAX_LIST = 60;
  const shown = records.slice(0, MAX_LIST);
  const groups = [];
  shown.forEach(r => {
    const d = new Date(r.occurred_at);
    const valid = !isNaN(d.getTime());
    const key = valid ? d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate() : 'unknown';
    let g = groups[groups.length - 1];
    if (!g || g.key !== key) { g = { key: key, valid: valid, d: d, items: [] }; groups.push(g); }
    g.items.push(r);
  });

  $('list').innerHTML = groups.map(g => {
    let spent = 0, earned = 0;
    g.items.forEach(r => {
      if (r.type !== 'income') spent += Number(r.amount);
      else earned += Number(r.amount);
    });
    const sum = spent > 0 ? '支出 ' + money(spent) : (earned > 0 ? '收入 ' + money(earned) : '');
    return '<div class="group-head"><span>' + (g.valid ? dayLabel(g.d) : '记录') + '</span>' +
      (sum ? '<span class="sum">' + sum + '</span>' : '') + '</div>' +
      '<div class="card">' + g.items.map(itemHtml).join('') + '</div>';
  }).join('') + (records.length > MAX_LIST
    ? '<div class="more-note">仅显示最近 ' + MAX_LIST + ' 条，更早记录见「统计」</div>'
    : '');

  if (statYm) renderStats();
}

/* ================= 数据加载 ================= */
/* 尽量多拉历史数据用于统计；接口对大 limit 报错时自动降级。
   服务端返回 truncated=true 说明可能被截断，此时统计会少算 ——
   记下来给统计页出警示条，不能静默。 */
async function fetchRecords() {
  let res;
  try { res = await api('/api/records?limit=1000'); }
  catch (e) { res = await api('/api/records?limit=100'); }
  dataTruncated = !!res.truncated;
  return res;
}

async function load() {
  setLoading();
  $('refresh').classList.add('spin');
  try {
    const res = await fetchRecords();
    records = res.data || [];
    render();
  } catch (e) {
    renderError(e);
    throw e;
  } finally {
    $('refresh').classList.remove('spin');
  }
}

/* ================= 统计视图 ================= */
function setView(v) {
  view = v;
  [...$('viewSeg').children].forEach(b => b.classList.toggle('on', b.dataset.view === v));
  $('viewList').hidden = v !== 'list';
  $('viewStats').hidden = v !== 'stats';
  if (v === 'stats') {
    if (!statYm) { const n = new Date(); statYm = { y: n.getFullYear(), m: n.getMonth() }; }
    renderStats();
  }
}

function shiftMonth(delta) {
  let y = statYm.y, m = statYm.m + delta;
  if (m < 0) { m = 11; y--; }
  if (m > 11) { m = 0; y++; }
  statYm = { y: y, m: m };
  selCat = null; selDay = null; selMon = null;
  renderStats();
}

function updateMonthNav() {
  const cur = new Date();

  /* 下个月：只在「当前月」禁用 —— 不让翻到未来。
     上个月：只要账本里有任何一条记录就不禁用。
     原来用的是「看有没有比当前查看月份更早的记录」，那个判据是坏的：
     翻到最早那个月之后 mPrev 就被禁死，再也回不去；
     账本为空时更是两个箭头全禁，用户会以为坏了。
     翻月本就是自由浏览，有没有数据是翻过去才知道的事。 */
  $('mNext').disabled = statYm.y === cur.getFullYear() && statYm.m === cur.getMonth();
  $('mPrev').disabled = records.length === 0;

  $('mLabel').textContent = statYm.y + '年' + (statYm.m + 1) + '月';

  /* 翻离本月后给一个「回到本月」的入口，翻远了能一键回来 */
  const back = $('mBack');
  if (back) {
    back.hidden = (statYm.y === cur.getFullYear() && statYm.m === cur.getMonth());
  }
}

function renderStats() {
  const y = statYm.y, m = statYm.m;
  const mr = monthRecords(y, m);

  /* 数据被截断时先把话说清楚，否则下面的数字看着正常、其实少算了 */
  const warn = $('truncWarn');
  if (dataTruncated) {
    warn.hidden = false;
    $('truncWarnText').textContent =
      '已加载 ' + records.length + ' 条，达到接口上限，统计可能不完整。建议改用服务端统计接口。';
  } else {
    warn.hidden = true;
  }

  /* 这个月一条记录都没有：摘要卡照常显示 0，图表区换成一句明确的话。
     不给图表的话用户只会看到空白，会以为页面坏了或箭头没生效。 */
  const emptyEl = $('monthEmpty');
  if (!mr.length) {
    emptyEl.hidden = false;
    emptyEl.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
        '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>' +
        '<line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>' +
      '</svg>' +
      (y + '年' + (m + 1) + '月没有记录');
  } else {
    emptyEl.hidden = true;
  }

  /* 图表区随月份有无数据一起显隐 */
  ['donutCard', 'dailyCard', 'monthlyCard'].forEach(function (id) {
    const el = $(id);
    if (el) el.hidden = !mr.length;
  });

  /* 摘要卡 */
  let exp = 0, inc = 0;
  mr.forEach(r => { if (r.type === 'income') inc += Number(r.amount); else exp += Number(r.amount); });
  $('stExp').textContent = money(exp);
  $('stInc').textContent = money(inc);
  const bal = inc - exp;
  const balEl = $('stBal');
  balEl.textContent = (bal < 0 ? '−' : '+') + money(Math.abs(bal));
  balEl.className = 'sc-val' + (bal > 0 ? ' pos' : bal < 0 ? ' neg' : '');

  if (!mr.length) {
    /* 没数据就不用画图了，跳过后面全部渲染 —— 但仍要更新月份导航 */
    updateMonthNav();
    return;
  }

  /* 分类占比（支出） */
  const catMap = new Map();
  mr.forEach(r => {
    if (r.type === 'income') return;
    const k = r.category || '未分类';
    catMap.set(k, (catMap.get(k) || 0) + Number(r.amount));
  });
  let cats = [...catMap.entries()].map(x => ({ name: x[0], amount: x[1] })).sort((a, b) => b.amount - a.amount);
  if (cats.length > 8) {
    const rest = cats.slice(7).reduce((s, c) => s + c.amount, 0);
    cats = cats.slice(0, 7).concat([{ name: '其他', amount: rest, merged: true }]);
  }
  renderDonut(cats, exp);
  renderDaily(mr, y, m);
  renderMonthly();
  updateMonthNav();
}

function renderDonut(cats, exp) {
  const box = $('donutBox');
  const svgEl = box.querySelector('svg');
  const center = $('donutCenter');
  const emptyEl = box.querySelector('.chart-empty');

  if (!cats.length) {
    svgEl.style.display = 'none';
    center.style.display = 'none';
    if (!emptyEl) box.insertAdjacentHTML('beforeend', '<div class="chart-empty">本月还没有支出记录</div>');
    $('donutLegend').innerHTML = '';
    return;
  }
  svgEl.style.display = '';
  center.style.display = '';
  if (emptyEl) emptyEl.remove();

  const total = cats.reduce((s, c) => s + c.amount, 0) || 1;
  cats.forEach(c => {
    c.color = c.merged ? '#8E8E93' : iconFor({ type: 'expense', category: c.name }).c;
    c.pct = c.amount / total * 100;
  });
  if (selCat && !cats.some(c => c.name === selCat)) selCat = null;
  const sel = cats.find(c => c.name === selCat);

  let cum = 0, arcs = '';
  cats.forEach(c => {
    arcs += '<circle cx="100" cy="100" r="78" fill="none" stroke="' + c.color + '" stroke-width="24" pathLength="100" stroke-dasharray="' + c.pct + ' ' + Math.max(0, 100 - c.pct) + '" stroke-dashoffset="' + (-cum) + '" data-cat="' + esc(c.name) + '"' + (selCat === c.name ? ' class="sel"' : '') + '/>';
    cum += c.pct;
  });

    ? '<div class="dc-val">' + money(sel.amount) + '</div><div class="dc-lab">' + esc(sel.name) + ' · ' + fmtPct(sel.pct) + '</div>'
    : '<div class="dc-val">' + money(exp) + '</div><div class="dc-lab">本月支出</div>';

  $('donutLegend').innerHTML = cats.map(c => {

    '</div>';
  }).join('');
}

function renderDaily(mr, y, m) {
  const box = $('dailyBox'), cap = $('dailyCap');
  const D = new Date(y, m + 1, 0).getDate();
  if (selDay && (selDay < 1 || selDay > D)) selDay = null;

  const amt = new Array(D + 1).fill(0);
  mr.forEach(r => {
    if (r.type === 'income') return;
    const d = recDate(r);
    const day = d.getDate();
    if (day >= 1 && day <= D) amt[day] += Number(r.amount);
  });

  if (!amt.some(v => v > 0)) {
    box.innerHTML = '<div class="chart-empty">本月暂无支出</div>';
    cap.textContent = '';
    return;
  }

  const cur = new Date();
  const today = (y === cur.getFullYear() && m === cur.getMonth()) ? cur.getDate() : 0;
  const totalExp = amt.reduce((s, v) => s + v, 0);
  const maxV = Math.max.apply(null, amt);
  const maxDay = amt.indexOf(maxV);
  const avg = totalExp / D;

  const W = 344, H = 128, TOP = 12, L = 36, R = 8, B = 18;
  const plotW = W - L - R, plotH = H - TOP - B;
  const step = niceStep(maxV);
  const gridTop = Math.ceil(maxV / step) * step;
  const yOf = v => TOP + plotH - (v / gridTop) * plotH;
  const slot = plotW / D;
  const bw = Math.min(16, Math.max(5, slot * 0.58));

  let s = '';
  for (let gv = step; gv <= gridTop + 0.001; gv += step) {
    const gy = yOf(gv);
    s += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + fx(gy) + '" y2="' + fx(gy) + '"/>' +
         '<text class="ax" x="' + (L - 5) + '" y="' + fx(gy + 3) + '" text-anchor="end">' + fmtShort(gv) + '</text>';
  }
  for (let d = 1; d <= D; d++) {
    const v = amt[d];
    const x = L + (d - 1) * slot + (slot - bw) / 2;
    if (v > 0) {
      const h = Math.max(2.5, (v / gridTop) * plotH);
      s += '<rect class="bar' + (d === selDay ? ' on' : d === today ? ' today' : '') + '" x="' + fx(x) + '" y="' + fx(TOP + plotH - h) + '" width="' + fx(bw) + '" height="' + fx(h) + '" rx="4"/>';
    } else {
      s += '<rect x="' + fx(x + bw / 2 - 0.75) + '" y="' + fx(TOP + plotH - 3) + '" width="1.5" height="3" fill="var(--label-3)" opacity="0.4"/>';
    }
    s += '<rect class="hit" data-day="' + d + '" x="' + fx(L + (d - 1) * slot) + '" y="' + TOP + '" width="' + fx(slot) + '" height="' + plotH + '" fill="transparent"/>';
  }
  const ay = yOf(avg);
  s += '<line class="avg" x1="' + L + '" x2="' + (W - R) + '" y1="' + fx(ay) + '" y2="' + fx(ay) + '"/>';
  [1, 5, 10, 15, 20, 25, 30].filter(d => d <= D).forEach(d => {
    s += '<text class="ax" x="' + fx(L + (d - 1) * slot + slot / 2) + '" y="' + (H - 5) + '" text-anchor="middle">' + d + '</text>';
  });

  box.innerHTML = '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="每日支出柱状图">' + s + '</svg>';
  cap.textContent = selDay
    ? (m + 1) + '月' + selDay + '日 · 支出 ' + money(amt[selDay] || 0) + ' · 再点一下取消'
    : '日均 ' + money(avg) + ' · 最高 ' + money(maxV) + '（' + (m + 1) + '月' + maxDay + '日）';
}

function renderMonthly() {
  const box = $('monthlyBox'), cap = $('monCap');
  const months = [];
  let y = statYm.y, m = statYm.m;
  for (let i = 0; i < 6; i++) { months.unshift({ y: y, m: m }); m--; if (m < 0) { m = 11; y--; } }

  const data = months.map(mm => {
    let e = 0, inc = 0;
    monthRecords(mm.y, mm.m).forEach(r => {
      if (r.type === 'income') inc += Number(r.amount); else e += Number(r.amount);
    });
    return { y: mm.y, m: mm.m, e: e, i: inc };
  });

  if (!data.some(d => d.e > 0 || d.i > 0)) {
    box.innerHTML = '<div class="chart-empty">暂无数据</div>';
    cap.textContent = '';
    return;
  }
  if (selMon && !data.some(d => monthKeyOf(d.y, d.m) === selMon)) selMon = null;

  const maxV = Math.max.apply(null, data.map(d => Math.max(d.e, d.i)).concat([1]));
  const W = 344, H = 128, TOP = 12, L = 36, R = 8, B = 18;
  const plotW = W - L - R, plotH = H - TOP - B;
  const step = niceStep(maxV);
  const gridTop = Math.ceil(maxV / step) * step;
  const yOf = v => TOP + plotH - (v / gridTop) * plotH;
  const groupW = plotW / 6;
  const bw = Math.min(13, groupW * 0.3);

  let s = '';
  for (let gv = step; gv <= gridTop + 0.001; gv += step) {
    const gy = yOf(gv);
    s += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + fx(gy) + '" y2="' + fx(gy) + '"/>' +
         '<text class="ax" x="' + (L - 5) + '" y="' + fx(gy + 3) + '" text-anchor="end">' + fmtShort(gv) + '</text>';
  }
  data.forEach((d, idx) => {
    const key = monthKeyOf(d.y, d.m);
    const sel = selMon === key;
    const cx = L + idx * groupW + groupW / 2;
    if (d.e > 0) {
      const top = yOf(d.e);
      s += '<rect class="bar' + (sel ? ' on' : '') + '" x="' + fx(cx - 3 - bw) + '" y="' + fx(top) + '" width="' + fx(bw) + '" height="' + fx(TOP + plotH - top) + '" rx="4"/>';
    }
    if (d.i > 0) {
      const top = yOf(d.i);
      s += '<rect class="bar in' + (sel ? ' on' : '') + '" x="' + fx(cx + 3) + '" y="' + fx(top) + '" width="' + fx(bw) + '" height="' + fx(TOP + plotH - top) + '" rx="4"/>';
    }
    s += '<text class="ax" x="' + fx(cx) + '" y="' + (H - 5) + '" text-anchor="middle">' + (d.m + 1) + '月</text>' +
         '<rect class="hit" data-mon="' + key + '" x="' + fx(L + idx * groupW) + '" y="' + TOP + '" width="' + fx(groupW) + '" height="' + plotH + '" fill="transparent"/>';
  });

  box.innerHTML = '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="近 6 个月收支对比">' + s + '</svg>';
  const sd = data.find(d => monthKeyOf(d.y, d.m) === (selMon || monthKeyOf(statYm.y, statYm.m))) || data[5];
  cap.textContent = sd.y + '年' + (sd.m + 1) + '月 · 支出 ' + money(sd.e) + ' · 收入 ' + money(sd.i) + (selMon ? ' · 再点一下取消' : '');
}

function nowLocal() {
  const n = new Date();
  return n.getFullYear() + '-' + pad(n.getMonth() + 1) + '-' + pad(n.getDate()) + 'T' + pad(n.getHours()) + ':' + pad(n.getMinutes());
}

function toLocalInput(d) {
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function syncFormMode(opts) {
  const inc = formType === 'income';
  const keepValue = !!(opts && opts.keepValue);
  $('addSheet').classList.toggle('income', inc);
  $('accountLabel').textContent = inc ? '到账方式' : '支付方式';
  $('catLabel').textContent = inc ? '收入类型' : '分类';

  const catOpts = inc ? CAT_INCOME : CAT_EXPENSE;
  const acctOpts = inc ? ACCOUNTS_INCOME : ACCOUNTS_EXPENSE;

  /* keepValue = 打开编辑既有记录：原值一律保留，哪怕不在选项集里
     （AI 可能给过「午餐」这种值，得原样带回去，不然一编辑就丢了）。
     否则 = 用户手动切类型：旧值不在新选项集里就该清掉 ——
     「餐饮」对收入类型毫无意义，留着只会让自定义框莫名其妙弹出来还带旧值。 */
  if (!keepValue) {
    dropIfAbsent('cat', catOpts);
    dropIfAbsent('acct', acctOpts);
  }

  collapseCustom('cat');
  collapseCustom('acct');
  buildChips('cat', catOpts);
  buildChips('acct', acctOpts);
}

/** 值不在选项集里就清空（仅在用户切类型时调用） */
function dropIfAbsent(kind, options) {
  const hidden = $(kind === 'cat' ? 'fCategory' : 'fAccount');
  const cur = (hidden.value || '').trim();
  if (cur && !options.some(o => o.v === cur)) hidden.value = '';
}

/* ================= 芯片选择器 =================
   一对「分类」「支付方式」共用一个实现：
     buildChips 铺选项，setChipValue 设值，readChip 取值。
   值都落在隐藏 input 里，提交时读法跟原来完全一致，改动面最小。 */

/** 铺芯片行。rawValue（当前值）不在选项里时会自动切到「自定义」态 */
function buildChips(kind, options) {
  const box = $(kind === 'cat' ? 'catChips' : 'acctChips');
  const hidden = $(kind === 'cat' ? 'fCategory' : 'fAccount');
  const cur = (hidden.value || '').trim();

  box.innerHTML = options.map(o =>
    '<button type="button" class="chip' + (o.v === cur ? ' on' : '') + '" data-val="' + esc(o.v) + '">' +
      (o.dot ? '<i class="dot-c" style="background:' + o.dot + '"></i>' : '') +
      esc(o.v) +
    '</button>'
  ).join('');

  /* 当前值不在预设里（AI 记的「午餐」，或手输的旧值）→ 亮起自定义并回填，
     这样编辑老记录不会悄无声息地把分类弄丢 */
  if (cur && !options.some(o => o.v === cur)) {
    openCustom(kind, cur);
  }
}

function setChipValue(kind, val) {
  const hidden = $(kind === 'cat' ? 'fCategory' : 'fAccount');
  hidden.value = val || '';
  const box = $(kind === 'cat' ? 'catChips' : 'acctChips');
  [...box.children].forEach(b => b.classList.toggle('on', b.dataset.val === val));
}

function readChip(kind) {
  return ($(kind === 'cat' ? 'fCategory' : 'fAccount').value || '').trim();
}

function openCustom(kind, val) {
  const wrap = $(kind === 'cat' ? 'catCustom' : 'acctCustom');
  const input = $(kind === 'cat' ? 'catCustomInput' : 'acctCustomInput');
  const btn = $(kind === 'cat' ? 'catCustomBtn' : 'acctCustomBtn');
  wrap.hidden = false;
  if (val !== undefined) input.value = val;
  btn.textContent = '收起';
  /* 自定义态下，预设芯片全部取消高亮 —— 避免「看着选的是餐饮、实际存的是午餐」 */
  const box = $(kind === 'cat' ? 'catChips' : 'acctChips');
  [...box.children].forEach(b => b.classList.remove('on'));
}

function collapseCustom(kind) {
  const wrap = $(kind === 'cat' ? 'catCustom' : 'acctCustom');
  const input = $(kind === 'cat' ? 'catCustomInput' : 'acctCustomInput');
  const btn = $(kind === 'cat' ? 'catCustomBtn' : 'acctCustomBtn');
  wrap.hidden = true;
  input.value = '';
  btn.textContent = '自定义…';
}

/** 点芯片：选中并写入隐藏值；点同一项可取消选中 */
function bindChips(kind) {
  const box = $(kind === 'cat' ? 'catChips' : 'acctChips');
  const hidden = $(kind === 'cat' ? 'fCategory' : 'fAccount');

  box.onclick = (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    const val = chip.dataset.val;
    /* 再点一下取消，方便「本来就没打算填」的情况 */
    const next = hidden.value === val ? '' : val;
    hidden.value = next;
    [...box.children].forEach(b => b.classList.toggle('on', b.dataset.val === next));
    /* 手选预设项后把自定义收起来，否则输入框和芯片会对不上 */
    if (next) collapseCustom(kind);
  };

  const customBtn = $(kind === 'cat' ? 'catCustomBtn' : 'acctCustomBtn');
  const customWrap = $(kind === 'cat' ? 'catCustom' : 'acctCustom');
  customBtn.onclick = () => {
    if (customWrap.hidden) {
      openCustom(kind, hidden.value || '');
      $(kind === 'cat' ? 'catCustomInput' : 'acctCustomInput').focus();
    } else {
      collapseCustom(kind);
    }
  };

  const ok = $(kind === 'cat' ? 'catCustomOk' : 'acctCustomOk');
  const input = $(kind === 'cat' ? 'catCustomInput' : 'acctCustomInput');
  const commit = () => {
    const v = input.value.trim().slice(0, 10);
    if (!v) { toast('请输入内容', true); return; }
    hidden.value = v;
    [...box.children].forEach(b => b.classList.remove('on'));
    toast('已选：' + v);
  };
  ok.onclick = () => { commit(); input.blur(); };
  input.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); commit(); } };
}

bindChips('cat');
bindChips('acct');
/* 脚本一加载就把默认（支出）的芯片铺好，别等到开抽屉才生成 ——
   万一 init 提前 return，抽屉里也不会是一片空白 */

/* rec 传记录 = 编辑模式并预填；不传 = 新增 */
function openSheet(rec) {
  editingId = rec ? rec.id : null;
  $('sheetTitle').textContent = rec ? '编辑记录' : '记一笔';
  $('delEntry').hidden = !rec;
  formType = (rec && rec.type === 'income') ? 'income' : 'expense';
  [...$('typeSeg').children].forEach(b => b.classList.toggle('on', b.dataset.type === formType));

  /* 先把值写进隐藏 input，再让 syncFormMode 按新类型铺芯片 ——
     顺序反了的话，芯片铺完会被这里的赋值清掉高亮。
     keepValue 让原值无论如何都留住（哪怕不在预设里）。 */
  $('fCategory').value = rec ? (rec.category || '') : '';
  $('fAccount').value = rec ? (rec.account || '') : '';
  syncFormMode({ keepValue: true });

  /* amount 可能是 null（AI 没识别出金额），直接塞会给输入框显示 "null" */
  $('fAmount').value = (rec && rec.amount !== null && rec.amount !== undefined) ? rec.amount : '';
  $('fNote').value = rec ? (rec.note || '') : '';
  const rd = rec ? new Date(rec.occurred_at) : null;
  $('fTime').value = (rd && !isNaN(rd.getTime())) ? toLocalInput(rd) : nowLocal();
  $('formMsg').textContent = '';
  $('formMsg').className = 'msg';
  $('mask').classList.add('on');
  syncScrollLock();
  if (matchMedia('(pointer: fine)').matches) setTimeout(() => $('fAmount').focus(), 350);
}

/* 更新记录：优先尝试 PUT；接口不支持时退回「先建新、再删旧」，避免把数据改丢 */
async function saveEdit(payload) {
  const q = '/api/records?id=' + encodeURIComponent(editingId);
  try {
    await api(q, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  } catch (e) {
    if (e.status !== 404 && e.status !== 405) throw e;
    await api('/api/records', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    try {
      await api(q, { method: 'DELETE' });
    } catch (e2) {
      const err = new Error('修改已保存，但旧记录删除失败，请在列表中手动删除重复项');
      err.partial = true;
      throw err;
    }
  }
}

$('save').onclick = async () => {
  const amount = $('fAmount').value.trim();
  if (!amount) { $('formMsg').textContent = '请输入金额'; $('formMsg').className = 'msg error'; return; }
  if (Number.isNaN(Number(amount)) || Number(amount) < 0) {
    $('formMsg').textContent = '金额格式不对'; $('formMsg').className = 'msg error'; return;
  }
  const tVal = $('fTime').value;
  const tDate = tVal ? new Date(tVal) : null;
  /* 直接拼 +08:00，不用 toISOString()：后者按设备时区换算，
     设备时区不是东八区时（出差、系统时区设成 UTC）时间会整体偏掉 */
  const occurred = (tDate && !isNaN(tDate.getTime()))
    ? tDate.getFullYear() + '-' + pad(tDate.getMonth() + 1) + '-' + pad(tDate.getDate()) +
      'T' + pad(tDate.getHours()) + ':' + pad(tDate.getMinutes()) + ':00+08:00'
    : null;
  $('save').disabled = true;
  try {
    const payload = {
      type: formType,
      amount: Number(amount),
      category: readChip('cat') || null,
      note: $('fNote').value.trim() || null,
      account: readChip('acct') || null,
    };
    if (occurred) payload.occurred_at = occurred;
    if (editingId) {
      await saveEdit(payload);
      closeSheet();
      await load();
      toast('已更新');
    } else {
      await api('/api/records', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      closeSheet();
      await load();
      const od = occurred ? new Date(occurred) : null;
      const now = new Date();
      if (od && !isNaN(od.getTime()) &&
          (od.getFullYear() !== now.getFullYear() || od.getMonth() !== now.getMonth())) {
        /* 跨月要说清楚：首页只汇总本月，不然用户看金额没变会以为没记上 */
        toast('已记入 ' + (od.getMonth() + 1) + '月' + od.getDate() + '日（非本月，首页汇总不变）');
      } else {
        toast('已保存');
      }
    }
  } catch (e) {
    if (e.partial) {
      closeSheet();
      await load();
      toast(e.message, true);
    } else {
      $('formMsg').textContent = (editingId ? '更新失败：' : '保存失败：') + e.message;
      $('formMsg').className = 'msg error';
    }
  } finally {
    $('save').disabled = false;
  }
};

/* ================= 事件：删除（点记录弹出确认） ================= */
function openDel(id) {
  pendingDeleteId = id;
  /* 把要删的东西写清楚 —— 只写「这条记录」的话，点错行时根本不知道删的是哪笔 */
  const rec = records.find(r => String(r.id) === String(id));
  const box = $('delDetail');
  if (rec) {
    const ic = iconFor(rec);
    const isExp = rec.type !== 'income';
    const bits = [];
    if (rec.note) bits.push(rec.note);
    if (rec.account) bits.push(rec.account);
    const d = new Date(rec.occurred_at);
    if (!isNaN(d.getTime())) bits.push((d.getMonth() + 1) + '月' + d.getDate() + '日');
    box.innerHTML =
      '<div class="ad-ic" style="color:' + ic.c + ';background:' + ic.c + '1E">' + ic.s + '</div>' +
      '<div>' +
        '<div class="ad-t">' + esc(rec.category || (isExp ? '支出' : '收入')) +
          ' ' + (isExp ? '−' : '+') + money(rec.amount) + '</div>' +
        (bits.length ? '<div class="ad-s">' + esc(bits.join(' · ')) + '</div>' : '') +
      '</div>';
    box.hidden = false;
  } else {
    box.hidden = true;
  }
  $('delMask').classList.add('on');
  syncScrollLock();
}

function closeDel() {
  $('delMask').classList.remove('on');
  syncScrollLock();
  pendingDeleteId = null;
}

$('delEntry').onclick = () => { if (editingId != null) openDel(editingId); };

$('list').onclick = (e) => {
  const it = e.target.closest('.item');
  if (!it || !it.dataset.id) return;
  const rec = records.find(r => String(r.id) === String(it.dataset.id));
  if (rec) openSheet(rec);
};
$('list').onkeydown = (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const it = e.target.closest('.item');
  if (!it || !it.dataset.id) return;
  e.preventDefault();
  const rec = records.find(r => String(r.id) === String(it.dataset.id));
  if (rec) openSheet(rec);
};
$('delCancel').onclick = closeDel;
$('delMask').onclick = (e) => { if (e.target === $('delMask')) closeDel(); };

$('delConfirm').onclick = async () => {
  const id = pendingDeleteId;
  if (!id) return;
  $('delConfirm').disabled = true;
  try {
    await api('/api/records?id=' + encodeURIComponent(id), { method: 'DELETE' });
    closeDel();
    closeSheet();
    await load();
    toast('已删除');
  } catch (err) {
    closeDel();
    toast('删除失败：' + err.message, true);
  } finally {
    $('delConfirm').disabled = false;
  }
};

/* ================= 启动 ================= */
(async function init() {
  cfg = loadCfg();
  if (!cfg || !cfg.api || !cfg.token) { showSetup(''); return; }
  try {
    await load();
    showMain();
  } catch (e) {
    showSetup('连不上：' + e.message, true);
  }
})();
</script>
</body>
</html>
